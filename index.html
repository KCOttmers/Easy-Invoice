<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Easy Invoice — Technical Billing</title>
  
  <!-- Vercel Analytics & Supabase -->
  <script defer src="https://cdn.vercel-insights.com/v1/script.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  
  <!-- Engineering Fonts: Inter for UI, JetBrains Mono for Data -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  
  <style>
    :root { --brand-color: #000000; }
    body { 
      font-family: 'Inter', sans-serif; 
      background-color: #f9fafb; 
      color: #000000; 
      -webkit-font-smoothing: antialiased;
    }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
    
    /* Technical, flat input styling */
    .paper-input { 
      background: transparent; 
      border: 1px solid transparent; 
      border-bottom: 1px solid #d1d5db; 
      border-radius: 0; 
      padding: 4px 8px; 
      transition: all 0.15s ease; 
      width: 100%; 
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px; 
    }
    .paper-input:hover { border-bottom-color: #9ca3af; background: #f3f4f6; }
    .paper-input:focus { outline: none; border-bottom-color: #000000; background: transparent; }
    
    .brand-bg { background-color: var(--brand-color); }
    .brand-text { color: var(--brand-color); }
    
    /* Strict print layout */
    @media print {
      @page { size: auto; margin: 10mm; }
      body { background: #ffffff !important; margin: 0 !important; padding: 0 !important; }
      .no-print { display: none !important; }
      #invoice-paper { border: none !important; margin: 0 !important; padding: 0 !important; max-width: 100% !important; width: 100% !important; }
      .paper-input { border: 1px solid transparent !important; background: transparent !important; padding: 2px 0 !important; }
    }
  </style>
</head>
<body class="selection:bg-black selection:text-white">

  <!-- TOP NAVIGATION BAR (Technical & Flat) -->
  <header class="no-print border-b border-gray-300 bg-white sticky top-0 z-40">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 h-14 flex items-center justify-between gap-2">
      <div class="flex items-center gap-3">
        <div class="w-7 h-7 bg-black text-white flex items-center justify-center font-mono font-bold text-sm">E</div>
        <span class="font-bold tracking-tight text-black text-sm uppercase">Easy Invoice</span>
      </div>

      <div class="flex items-center bg-gray-100 p-0.5 border border-gray-300">
        <button onclick="switchAppView('editor')" id="tab-editor" class="px-4 py-1 text-xs font-semibold bg-white text-black border border-gray-300 transition cursor-pointer">
          Editor
        </button>
        <button onclick="switchAppView('history')" id="tab-history" class="px-4 py-1 text-xs font-semibold text-gray-500 hover:text-black transition cursor-pointer border border-transparent">
          History
        </button>
        <button onclick="switchAppView('client')" id="tab-client" class="px-4 py-1 text-xs font-semibold text-gray-500 hover:text-black transition cursor-pointer border border-transparent flex items-center gap-1.5">
          Client View <span class="w-1.5 h-1.5 bg-emerald-500 rounded-none"></span>
        </button>
      </div>

      <div class="flex items-center gap-3 text-sm">
        <button id="auth-btn" onclick="openAuthModal()" class="px-4 py-1 border border-black text-xs font-semibold text-black hover:bg-black hover:text-white transition cursor-pointer">
          Sign In
        </button>
        <button onclick="copyShareableClientLink()" id="copy-link-btn" class="px-4 py-1 bg-black text-white text-xs font-semibold hover:bg-gray-800 transition cursor-pointer font-mono">
          <span id="copy-link-text">COPY_LINK</span>
        </button>
      </div>
    </div>
  </header>

  <!-- AUTHENTICATION MODAL -->
  <div id="auth-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-gray-900/50">
    <div class="bg-white p-8 border border-black max-w-sm w-full relative">
      <button onclick="closeAuthModal()" class="absolute top-4 right-4 text-gray-400 hover:text-black text-xl font-bold cursor-pointer font-mono">&times;</button>
      <h2 class="text-lg font-bold text-black mb-1 uppercase tracking-tight">System Access</h2>
      <p class="text-xs text-gray-500 mb-6 font-mono">Authenticate to sync records to the cloud.</p>
      
      <div class="space-y-4">
        <div>
          <label class="block text-xs font-bold text-gray-700 mb-1 uppercase">Email</label>
          <input type="email" id="auth-email" placeholder="sys@admin.com" class="font-mono text-sm border border-gray-300 w-full p-2 focus:outline-none focus:border-black">
        </div>
        <div>
          <label class="block text-xs font-bold text-gray-700 mb-1 uppercase">Password</label>
          <input type="password" id="auth-password" placeholder="••••••••" class="font-mono text-sm border border-gray-300 w-full p-2 focus:outline-none focus:border-black">
        </div>
        
        <div class="pt-4 flex gap-2">
          <button onclick="handleLogin()" class="flex-1 bg-black text-white py-2 text-xs font-bold hover:bg-gray-800 transition cursor-pointer uppercase">Login</button>
          <button onclick="handleSignUp()" class="flex-1 bg-white border border-black text-black py-2 text-xs font-bold hover:bg-gray-100 transition cursor-pointer uppercase">Sign Up</button>
        </div>
        <p id="auth-error" class="text-xs text-red-600 mt-2 hidden font-mono"></p>
      </div>
    </div>
  </div>

  <!-- ================================================================= -->
  <!-- VIEW 1: EDITOR & BUILDER CONTROLS                                 -->
  <!-- ================================================================= -->
  <div id="editor-view-container">
    <section class="no-print max-w-5xl mx-auto px-4 mt-6 mb-6">
      <div class="bg-white border border-gray-300 p-4 flex flex-wrap items-center justify-between gap-4">
        <div class="flex flex-wrap items-center gap-6">
          <div>
            <label class="block text-[10px] font-bold font-mono uppercase tracking-widest text-gray-500 mb-1.5">Document Type</label>
            <div class="inline-flex bg-gray-100 border border-gray-300 p-0.5">
              <button onclick="setDocMode('full')" id="mode-full" class="px-3 py-1 text-xs font-semibold bg-white text-black border border-gray-300 transition cursor-pointer">INV</button>
              <button onclick="setDocMode('deposit')" id="mode-deposit" class="px-3 py-1 text-xs font-semibold text-gray-500 hover:text-black transition cursor-pointer border border-transparent">DEP(50%)</button>
              <button onclick="setDocMode('quote')" id="mode-quote" class="px-3 py-1 text-xs font-semibold text-gray-500 hover:text-black transition cursor-pointer border border-transparent">QUO</button>
            </div>
          </div>

          <div>
            <label class="block text-[10px] font-bold font-mono uppercase tracking-widest text-gray-500 mb-1.5">Billing Mode</label>
            <div class="inline-flex bg-gray-100 border border-gray-300 p-0.5">
              <button onclick="setBillingMode('hourly')" id="billing-hourly" class="px-3 py-1 text-xs font-semibold bg-white text-black border border-gray-300 transition cursor-pointer">HRLY</button>
              <button onclick="setBillingMode('flat')" id="billing-flat" class="px-3 py-1 text-xs font-semibold text-gray-500 hover:text-black transition cursor-pointer border border-transparent">FLAT</button>
            </div>
          </div>

          <div>
            <label class="block text-[10px] font-bold font-mono uppercase tracking-widest text-gray-500 mb-1.5">Currency</label>
            <select id="currency-select" onchange="updateCurrency()" class="bg-gray-100 border border-gray-300 text-black text-xs font-mono font-semibold px-3 py-1 outline-none cursor-pointer">
              <option value="$">USD</option>
              <option value="€">EUR</option>
              <option value="£">GBP</option>
              <option value="CA$">CAD</option>
            </select>
          </div>

          <div>
            <label class="block text-[10px] font-bold font-mono uppercase tracking-widest text-gray-500 mb-1.5">Accent</label>
            <div class="flex items-center gap-2 pt-1">
              <button onclick="setAccentColor('#000000')" class="w-4 h-4 bg-black border border-gray-400 cursor-pointer"></button>
              <button onclick="setAccentColor('#2563eb')" class="w-4 h-4 bg-blue-600 border border-gray-400 cursor-pointer"></button>
              <button onclick="setAccentColor('#059669')" class="w-4 h-4 bg-emerald-600 border border-gray-400 cursor-pointer"></button>
              <button onclick="setAccentColor('#dc2626')" class="w-4 h-4 bg-red-600 border border-gray-400 cursor-pointer"></button>
            </div>
          </div>
        </div>

        <div class="flex items-center gap-3 w-full sm:w-auto justify-end">
          <button onclick="resetDefaults()" class="text-gray-400 hover:text-black text-xs underline cursor-pointer font-mono">Reset</button>
          <button onclick="downloadPDF()" class="brand-bg hover:opacity-90 text-white px-4 py-2 text-xs font-bold
